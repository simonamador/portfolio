name: Normalize public profile

on:
  push:
    paths:
      - .github/workflows/normalize-public-profile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update English and Spanish profile pages
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("index.html"): {
                  "AI Engineer building reliable GenAI and RAG systems for healthcare, and biomedical AI researcher.": "AI Engineer building reliable AI systems in healthcare, and biomedical AI researcher.",
                  "AI Engineer building reliable GenAI and RAG systems for healthcare. Biomedical AI researcher and NeuroImage 2025 co-author.": "AI Engineer building reliable AI systems in healthcare. Biomedical AI researcher and NeuroImage 2025 co-author.",
                  '"jobTitle": "Lead AI Engineer"': '"jobTitle": "AI Engineer"',
                  "AI Engineer building reliable systems for healthcare and knowledge-intensive teams.": "AI Engineer building reliable AI systems in healthcare and for knowledge-intensive teams.",
                  "Production AI systems for healthcare workflows.": "Production AI systems in pharmaceutical workflows.",
                  "building reliable AI systems for healthcare and knowledge-intensive work": "building reliable AI systems in healthcare and for knowledge-intensive work",
                  '<h3 class="exp-role">Lead AI Engineer</h3>': '<h3 class="exp-role">AI Engineer</h3>',
                  "Built and scaled internal GenAI systems for pharmaceutical commercial and medical workflows.": "Built and scaled internal GenAI systems for pharmaceutical commercial and medical workflows, including a clinical RAG platform handling 7,000+ queries per week.",
              },
              Path("es/index.html"): {
                  "ingeniero de IA que construye sistemas confiables de GenAI y RAG para salud, e investigador en IA biomédica.": "ingeniero de IA que construye sistemas confiables de IA en salud, e investigador en IA biomédica.",
                  "Ingeniero de IA construyendo sistemas confiables de GenAI y RAG para salud. Investigador en IA biomédica y coautor en NeuroImage 2025.": "Ingeniero de IA construyendo sistemas confiables de IA en salud. Investigador en IA biomédica y coautor en NeuroImage 2025.",
                  '"jobTitle": "Ingeniero Líder de Inteligencia Artificial"': '"jobTitle": "Ingeniero de Inteligencia Artificial"',
                  "Ingeniero de IA construyendo sistemas confiables para salud y equipos intensivos en conocimiento.": "Ingeniero de IA construyendo sistemas confiables de IA en salud y para equipos intensivos en conocimiento.",
                  "Sistemas de IA en producción para flujos de salud.": "Sistemas de IA en producción para procesos farmacéuticos.",
                  "construyo sistemas confiables de IA para salud y trabajo intensivo en conocimiento": "construyo sistemas confiables de IA en salud y para trabajo intensivo en conocimiento",
                  '<h3 class="exp-role">Lead AI Engineer</h3>': '<h3 class="exp-role">AI Engineer</h3>',
                  "Construí y escalé sistemas internos de GenAI para procesos comerciales y médicos del sector farmacéutico.": "Construí y escalé sistemas internos de GenAI para procesos comerciales y médicos del sector farmacéutico, incluyendo una plataforma RAG clínica que procesa más de 7,000 consultas por semana.",
              },
          }

          old_title = "Conditional deep generative normative modeling for fetal brain anomaly detection"
          new_title = "Conditional deep generative normative modeling for structural and developmental anomaly detection in the fetal brain"
          old_doi = "10.1016/j.neuroimage.2025.121089"
          new_doi = "10.1016/j.neuroimage.2025.121442"

          for path, changes in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in changes.items():
                  if old not in text:
                      raise RuntimeError(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new)
              if old_title not in text:
                  raise RuntimeError(f"Expected publication title not found in {path}")
              if old_doi not in text:
                  raise RuntimeError(f"Expected DOI not found in {path}")
              text = text.replace(old_title, new_title).replace(old_doi, new_doi)
              path.write_text(text, encoding="utf-8")
      - name: Commit normalized profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html es/index.html
          git commit -m "fix(profile): normalize positioning, metrics and publication"
          git push
